<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JARVIS - Anderson</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #00f0ff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #111827;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #00f0ff;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 2px 10px rgba(0, 240, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .mensaje {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 0.95rem;
        }
        .user {
            background: #1f2937;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            border: 1px solid #374151;
        }
        .jarvis {
            background: #0f172a;
            color: #00f0ff;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #00f0ff44;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.1);
        }
        .input-panel {
            background: #111827;
            padding: 10px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #00f0ff44;
        }
        input, button {
            background: #1f2937;
            color: #00f0ff;
            border: 1px solid #00f0ff66;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        input {
            flex: 1;
            color: #fff;
        }
        button {
            cursor: pointer;
            font-weight: bold;
            background: #00f0ff;
            color: #0b0f19;
            border: none;
        }
        .config-box {
            padding: 8px 12px;
            background: #161e2e;
            border-bottom: 1px solid #374151;
            display: flex;
            gap: 8px;
        }
        .config-box input {
            font-size: 0.8rem;
            padding: 8px;
        }
    </style>
</head>
<body>

    <header>
        <span>🤖</span> JARVIS SYSTEM
    </header>

    <div class="config-box">
        <input type="password" id="api-key" placeholder="Pega tu API Key de OpenRouter..." />
        <button id="btn-guardar" type="button" onclick="guardarKey()">Guardar</button>
    </div>

    <div id="chat-container">
        <div class="mensaje jarvis">Hola, Comandante Anderson. Bienvenido a su aplicación personal. ¿En qué le puedo asistir hoy?</div>
    </div>

    <div class="input-panel">
        <input type="text" id="userInput" placeholder="Escribe tu orden..." onkeydown="chequearEnter(event)" />
        <button id="btn-enviar" type="button" onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem("jarvis_key");
            if (savedKey) {
                document.getElementById("api-key").value = savedKey;
            }
        });

        function guardarKey() {
            const keyInput = document.getElementById("api-key").value.trim();
            if(!keyInput) {
                alert("Por favor pega una API Key válida.");
                return;
            }
            localStorage.setItem("jarvis_key", keyInput);
            alert("¡API Key guardada correctamente!");
        }

        function chequearEnter(e) {
            if (e.key === "Enter") enviarMensaje();
        }

        async function enviarMensaje() {
            const inputField = document.getElementById("userInput");
            const texto = inputField.value.trim();
            const currentKey = localStorage.getItem("jarvis_key") || document.getElementById("api-key").value.trim();

            if (!texto) return;

            if (!currentKey) {
                alert("Por favor configura y guarda tu API Key primero.");
                return;
            }

            agregarMensaje(texto, "user");
            inputField.value = "";

            const loadingId = agregarMensaje("Procesando...", "jarvis");

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + currentKey,
                        "HTTP-Referer": window.location.href,
                        "X-Title": "JARVIS Assistant"
                    },
                    body: JSON.stringify({
                        "model": "openai/gpt-4o-mini",
                        "messages": [
                            {"role": "system", "content": "Eres JARVIS, el asistente leal y muy inteligente del Comandante Anderson. Respóndele de forma rápida, futurista y eficiente."},
                            {"role": "user", "content": texto}
                        ]
                    })
                });

                const data = await response.json();
                const loadingElem = document.getElementById(loadingId);
                if(loadingElem) loadingElem.remove();

                if (response.ok && data.choices && data.choices.length > 0) {
                    agregarMensaje(data.choices[0].message.content, "jarvis");
                } else {
                    const errorMsg = data.error ? data.error.message : "Error al comunicarse con la API";
                    agregarMensaje("❌ Error: " + errorMsg, "jarvis");
                }
            } catch (error) {
                const loadingElem = document.getElementById(loadingId);
                if(loadingElem) loadingElem.remove();
                agregarMensaje("❌ Error de red: " + error.message, "jarvis");
            }
        }

        function agregarMensaje(texto, remitente) {
            const chatContainer = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = `mensaje ${remitente}`;
            const id = "msg_" + Math.random().toString(36).substr(2, 9);
            div.id = id;
            div.innerText = texto;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
